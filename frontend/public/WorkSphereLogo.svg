<svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sphereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Container with rounded glassmorphism background -->
  <rect x="8" y="8" width="64" height="64" rx="18" fill="url(#sphereGrad)" opacity="0.12" />
  <rect x="8" y="8" width="64" height="64" rx="18" fill="none" stroke="url(#sphereGrad)" stroke-width="1.5" opacity="0.3" />
  
  <!-- WorkSphere 3D Orbit & Core Sphere Icon -->
  <g transform="translate(40, 40)" filter="url(#glow)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="url(#sphereGrad)" stroke-width="2" transform="rotate(-25)" stroke-dasharray="32 6"/>
    <!-- Orbiting Satellite Bead -->
    <circle cx="16" cy="-8" r="3.5" fill="#06b6d4" />

    <!-- Central Sphere / Globe with subtle depth -->
    <circle cx="0" cy="0" r="11" fill="url(#sphereGrad)"/>
    
    <!-- Briefcase notch / Work symbol inside central sphere -->
    <rect x="-4" y="-3" width="8" height="6" rx="1.5" fill="#ffffff" opacity="0.95"/>
    <path d="M -2,-3 L -2,-5 Q -2,-6 0,-6 Q 2,-6 2,-5 L 2,-3" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="url(#sphereGrad)" stroke-width="1"/>
  </g>

  <!-- Wordmark Text -->
  <g>
    <text x="88" y="38" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1e293b" letter-spacing="-0.5">
      Work
    </text>
    <text x="88" y="63" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Sphere
    </text>
  </g>

  <!-- Subtle dynamic accent line -->
  <path d="M 88,68 L 220,68" stroke="url(#sphereGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
</svg>
